# HTTP server - redirect to HTTPS
server {
    listen 80;
    server_name view.canopi.live;
    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name view.canopi.live;
    
    # SSL certificates (configured by certbot)
    # ssl_certificate /etc/letsencrypt/live/view.canopi.live/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/view.canopi.live/privkey.pem;

    # Serve multi-Canopi chat application
    # Frontend files served from /public/multi-canopi-chat/
    # API and WebSocket proxied to Express app on port 3002
    location / {
        # Serve static files from public/multi-canopi-chat directory
        root /home/ubuntu/canopi/public/multi-canopi-chat;
        try_files $uri $uri/ /index.html;
        index index.html;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # API endpoints - proxy to Express backend
    location /api/ {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # WebSocket support for real-time Canopi chat updates
    location /ws {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://localhost:3002/health;
        proxy_set_header Host $host;
    }

    # Web3Auth test page - proxy to Express for server-side Client ID injection
    location /web3auth-test {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}



