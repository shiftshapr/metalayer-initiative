server {
    listen 80;
    server_name share.canopi.live;

    # Redirect HTTP to HTTPS (if SSL is configured)
    # Uncomment after SSL setup:
    # return 301 https://$server_name$request_uri;

    # CORS headers for extension access
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;

    # Serve share message resolver page
    # app.js runs on port 3002 and has /share-message route
    location / {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API endpoints for fetching message data
    location /v1/ {
        proxy_pass http://localhost:3002/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://localhost:3002/health;
        proxy_set_header Host $host;
    }

    # Serve static test files
    location /tab-manager-test/ {
        alias /home/ubuntu/canopi/public/tab-manager-test/;
        try_files $uri $uri/ /tab-manager-test/index.html;
        add_header 'Access-Control-Allow-Origin' '*' always;
    }
}

